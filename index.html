<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Japanese Walking</title><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:28px 18px}.num{font-size:34px;font-weight:800}.label{color:#aaa;font-size:18px;margin:5px 0 22px}.phase{font-size:26px;margin-top:25px}.time{font-size:88px;font-weight:700;font-variant-numeric:tabular-nums;margin:15px 0}.round{color:#aaa;font-size:18px;margin-bottom:24px}button{border:0;border-radius:15px;padding:17px 25px;font-size:18px;font-weight:700;margin:5px}.week{background:#292929;color:#fff;width:43%}.active{background:#4cd964;color:#111}.start{background:#4cd964;color:#111}.stop{background:#444;color:#fff}.info{margin-top:22px;background:#222;border-radius:15px;padding:15px;text-align:left;line-height:1.8}</style></head><body><main><h1>Japanese Walking</h1><button class="week active" data-p="1">1</button><button class="week" data-p="2">2</button><button class="week" data-p="3">3</button><button class="week" data-p="4">4</button><div id="label" class="label">Week 1–2</div><div id="phase" class="phase">Warming-up</div><div id="time" class="time">05:00</div><div id="round" class="round">Klaar om te starten</div><button id="start" class="start">▶ Start</button><button id="stop" class="stop">■ Stop</button><div id="info" class="info"></div></main><script>const plans={1:{label:'Week 1–2',fast:3,slow:3,reps:4},2:{label:'Week 3–4',fast:3,slow:3,reps:5},3:{label:'Week 5–6',fast:3,slow:3,reps:5},4:{label:'Week 7–8',fast:3,slow:3,reps:6}};let selected=1,phase='warm',remaining=300,rep=0,running=false,timer=null,audio=null;const $=id=>document.getElementById(id);function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function draw(){$('time').textContent=fmt(remaining);$('label').textContent=plans[selected].label;if(phase==='warm'){$('phase').textContent='Warming-up';$('round').textContent='Voorbereiding'}else if(phase==='fast'){$('phase').textContent='Stevig';$('round').textContent='Ronde '+rep+' van '+plans[selected].reps}else if(phase==='slow'){$('phase').textContent='Rustig';$('round').textContent='Ronde '+rep+' van '+plans[selected].reps}else{$('phase').textContent='Klaar!';$('round').textContent='Training voltooid 🎉'}}function info(){let p=plans[selected];$('info').innerHTML='Warming-up: <b>5 min</b><br>Stevig: <b>'+p.fast+' min</b><br>Rustig: <b>'+p.slow+' min</b><br>Herhalingen: <b>'+p.reps+'×</b>'}function beep(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=900;g.gain.value=.25;o.connect(g);g.connect(audio.destination);o.start();setTimeout(()=>o.stop(),300)}catch(e){}}function next(){beep();let p=plans[selected];if(phase==='warm'){phase='fast';rep=1;remaining=p.fast*60}else if(phase==='fast'){if(rep<p.reps){phase='slow';remaining=p.slow*60}else{phase='done';running=false;clearInterval(timer);remaining=0;beep()}}else if(phase==='slow'){rep++;phase='fast';remaining=p.fast*60}draw()}document.querySelectorAll('.week').forEach(b=>b.onclick=()=>{if(running)return;document.querySelectorAll('.week').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=+b.dataset.p;phase='warm';remaining=300;rep=0;info();draw()});$('start').onclick=()=>{if(running)return;if(phase==='done'){phase='warm';remaining=300;rep=0}running=true;beep();draw();clearInterval(timer);timer=setInterval(()=>{if(!running)return;remaining--;if(remaining<=0){remaining=0;next()}else draw()},1000)};$('stop').onclick=()=>{running=false;clearInterval(timer);phase='warm';remaining=300;rep=0;draw()};info();draw();</script></body></html>
